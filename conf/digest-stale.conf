Include conf/common.conf
<Directory /data>
    Dav On
    Options Indexes
    AuthType Digest
    AuthName "rclone-test"
    AuthDigestProvider file
    AuthUserFile /usr/local/apache2/conf/digest.passwd
    # Nonce expires almost immediately, so challenges come back
    # stale=true and every request has to be signed again.
    AuthDigestNonceLifetime 5
    Require valid-user
</Directory>
