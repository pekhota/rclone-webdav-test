Include conf/common.conf

# Apache only implements MD5, and rejects "AuthDigestAlgorithm MD5-sess" at
# startup, so the challenge is synthesised instead. This server answers 401 to
# everything - it exists only to check that rclone reports an algorithm it
# can't sign with, rather than claiming digest wasn't offered.
<Location "/">
    Header always set WWW-Authenticate "Digest realm=\"rclone-test\", nonce=\"md5sess-nonce\", algorithm=MD5-sess, qop=\"auth\""
    Redirect 401
</Location>
