Include conf/common.conf
<Directory /data>
    Dav On
    Options Indexes
    AuthType Digest
    AuthName "rclone-test"
    AuthDigestProvider file
    AuthUserFile /usr/local/apache2/conf/digest.passwd
    AuthDigestNonceLifetime 300
    # Requires nonce counts to arrive in the order they were issued, so
    # concurrent transfers are rejected. Needs --transfers 1 --checkers 1.
    AuthDigestNcCheck On
    Require valid-user
</Directory>
