# Remotes for the servers in docker-compose.yml. Use with:
#   rclone --config <this file> ls dav-digest:
# Password is "secret" everywhere except nextcloud/owncloud ("secretsecret").
[dav-open]
type = webdav
url = http://localhost:18100/

[dav-basic]
type = webdav
url = http://localhost:18101/
user = alice
pass = dHkQfrdjZT_HCEAIK-Gk52hx6qSJXQ

[dav-rclone]
type = webdav
url = http://localhost:18102/
vendor = rclone
user = alice
pass = dHkQfrdjZT_HCEAIK-Gk52hx6qSJXQ

# digest discovered from the 401 - rclone writes digest = true here on first use
[dav-digest]
type = webdav
url = http://localhost:18103/
user = alice
pass = dHkQfrdjZT_HCEAIK-Gk52hx6qSJXQ
digest = true

# same server, but told up front so no password goes out as basic
[dav-digest-preset]
type = webdav
url = http://localhost:18103/
user = alice
pass = dHkQfrdjZT_HCEAIK-Gk52hx6qSJXQ
digest = true

# nonce expires after 5s, so challenges come back stale=true mid-session
[dav-digest-stale]
type = webdav
url = http://localhost:18104/
user = alice
pass = dHkQfrdjZT_HCEAIK-Gk52hx6qSJXQ
digest = true

# AuthDigestNcCheck On - needs --transfers 1 --checkers 1
[dav-digest-nccheck]
type = webdav
url = http://localhost:18105/
user = alice
pass = dHkQfrdjZT_HCEAIK-Gk52hx6qSJXQ
digest = true

# offers algorithm=MD5-sess, which rclone can't sign with
[dav-digest-md5sess]
type = webdav
url = http://localhost:18106/
user = alice
pass = dHkQfrdjZT_HCEAIK-Gk52hx6qSJXQ

[dav-nextcloud]
type = webdav
url = http://localhost:18110/remote.php/dav/files/alice/
vendor = nextcloud
user = alice
pass = 7WmcMuXVDibWtZJ2ZwVGMIpKpAIEYzbtwiILYQ

[dav-owncloud]
type = webdav
url = http://localhost:18111/remote.php/webdav/
vendor = owncloud
user = alice
pass = 7WmcMuXVDibWtZJ2ZwVGMIpKpAIEYzbtwiILYQ

